<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#151229"/><stop offset="1" stop-color="#0b1a24"/></linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 70) scale(380)"><stop stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(690 400) scale(380)"><stop stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#fff" stroke-opacity=".04"/></pattern>
    <g id="ok"><circle r="9" fill="#22c55e"/><path d="M-4 0l3 3 5-6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#g1)"/>
  <rect width="800" height="450" fill="url(#g2)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- page objects -->
  <g transform="translate(60 150)">
    <rect x="16" y="-16" width="130" height="84" rx="12" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".1"/>
    <rect x="8" y="-8" width="130" height="84" rx="12" fill="#151a2c" stroke="#fff" stroke-opacity=".12"/>
    <rect width="130" height="84" rx="12" fill="#1a1f35" stroke="url(#ac)" stroke-opacity=".7"/>
    <text x="18" y="34" fill="#a78bfa" font-size="20" font-weight="700">&lt;/&gt;</text>
    <rect x="18" y="50" width="88" height="7" rx="3.5" fill="#fff" fill-opacity=".18"/>
    <rect x="18" y="64" width="60" height="7" rx="3.5" fill="#fff" fill-opacity=".1"/>
    <text x="0" y="118" fill="#9ba3b9" font-size="13">page objects</text>
  </g>

  <!-- Android phone -->
  <g transform="translate(240 60)">
    <rect width="160" height="320" rx="26" fill="#0f1222" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <rect x="10" y="16" width="140" height="290" rx="16" fill="#0a0c18"/>
    <circle cx="80" cy="9" r="3" fill="#fff" fill-opacity=".3"/>
    <rect x="24" y="32" width="70" height="10" rx="5" fill="url(#ac)"/>
    <rect x="24" y="56" width="112" height="72" rx="10" fill="#fff" fill-opacity=".06"/>
    <polyline points="34,112 52,98 70,106 88,80 106,90 124,70" stroke="url(#ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff">
      <circle cx="32" cy="152" r="7" fill-opacity=".1"/><rect x="46" y="148" width="64" height="8" rx="4" fill-opacity=".16"/>
      <circle cx="32" cy="182" r="7" fill-opacity=".1"/><rect x="46" y="178" width="52" height="8" rx="4" fill-opacity=".16"/>
      <circle cx="32" cy="212" r="7" fill-opacity=".1"/><rect x="46" y="208" width="70" height="8" rx="4" fill-opacity=".16"/>
    </g>
    <use href="#ok" x="126" y="152"/><use href="#ok" x="126" y="182"/><use href="#ok" x="126" y="212"/>
    <rect x="24" y="258" width="112" height="30" rx="15" fill="url(#ac)" fill-opacity=".9"/>
  </g>

  <!-- iOS phone -->
  <g transform="translate(420 90)">
    <rect width="160" height="320" rx="30" fill="#0f1222" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <rect x="10" y="10" width="140" height="300" rx="22" fill="#0a0c18"/>
    <rect x="55" y="18" width="50" height="13" rx="6.5" fill="#000"/>
    <text x="22" y="62" fill="#e8eaf2" font-size="12" font-weight="700">TESTS</text>
    <g fill="#fff" fill-opacity=".16">
      <rect x="22" y="86" width="80" height="8" rx="4"/>
      <rect x="22" y="120" width="64" height="8" rx="4"/>
      <rect x="22" y="154" width="86" height="8" rx="4"/>
      <rect x="22" y="188" width="56" height="8" rx="4"/>
      <rect x="22" y="222" width="74" height="8" rx="4"/>
      <rect x="22" y="256" width="68" height="8" rx="4"/>
    </g>
    <use href="#ok" x="128" y="90"/><use href="#ok" x="128" y="124"/><use href="#ok" x="128" y="158"/>
    <g transform="translate(128 192)"><circle r="9" fill="#22d3ee"/><path d="M4 -1.5A4.5 4.5 0 1 0 3 3" stroke="#0a0c18" stroke-width="2" stroke-linecap="round"/><path d="M4.5 -5v4h-4" stroke="#0a0c18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <use href="#ok" x="128" y="226"/><use href="#ok" x="128" y="260"/>
  </g>

  <!-- CI pipeline -->
  <g transform="translate(630 130)">
    <path d="M10 0V160" stroke="url(#ac)" stroke-width="2" stroke-dasharray="4 6"/>
    <use href="#ok" x="10" y="0"/><use href="#ok" x="10" y="80"/><use href="#ok" x="10" y="160"/>
    <text x="30" y="5" fill="#9ba3b9" font-size="13">build</text>
    <text x="30" y="85" fill="#9ba3b9" font-size="13">android</text>
    <text x="30" y="165" fill="#9ba3b9" font-size="13">ios</text>
  </g>
</svg>
