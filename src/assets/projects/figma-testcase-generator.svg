<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#151229"/><stop offset="1" stop-color="#0b1a24"/></linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 120) scale(340)"><stop stop-color="#f472b6" stop-opacity=".3"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 300) scale(360)"><stop stop-color="#8b5cf6" stop-opacity=".4"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#fff" stroke-opacity=".04"/></pattern>
    <rect id="h" x="-4" y="-4" width="8" height="8" fill="#fff" stroke="#22d3ee" stroke-width="1.5"/>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#g1)"/>
  <rect width="800" height="450" fill="url(#g2)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- design frame -->
  <text x="90" y="56" fill="#9ba3b9" font-size="12">Login &#183; Frame</text>
  <g transform="translate(90 66)">
    <rect width="190" height="330" rx="20" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="95" cy="62" r="24" fill="url(#ac)" fill-opacity=".8"/>
    <rect x="55" y="102" width="80" height="9" rx="4.5" fill="#fff" fill-opacity=".3"/>
    <rect x="20" y="140" width="150" height="36" rx="10" stroke="#fff" stroke-opacity=".25"/>
    <rect x="32" y="154" width="60" height="8" rx="4" fill="#fff" fill-opacity=".15"/>
    <rect x="20" y="190" width="150" height="36" rx="10" stroke="#fff" stroke-opacity=".25"/>
    <rect x="32" y="204" width="80" height="8" rx="4" fill="#fff" fill-opacity=".15"/>
    <rect x="20" y="248" width="150" height="38" rx="19" fill="url(#ac)"/>
    <rect x="60" y="263" width="70" height="8" rx="4" fill="#0a0c18" fill-opacity=".6"/>
    <!-- selection -->
    <rect x="14" y="242" width="162" height="50" stroke="#22d3ee" stroke-width="1.5"/>
    <use href="#h" x="14" y="242"/><use href="#h" x="176" y="242"/><use href="#h" x="14" y="292"/><use href="#h" x="176" y="292"/>
  </g>

  <path d="M300 225H350" stroke="url(#ac)" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="394" cy="225" r="40" fill="#0f1222" stroke="url(#ac)" stroke-width="2.5"/>
  <path d="M394 201c3 13 8 19 22 22-14 3-19 9-22 22-3-13-8-19-22-22 14-3 19-9 22-22z" fill="url(#ac)"/>
  <path d="M438 225H478" stroke="url(#ac)" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M472 219l8 6-8 6" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- test cases -->
  <rect x="512" y="84" width="236" height="310" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".08"/>
  <g transform="translate(496 68)">
    <rect width="236" height="310" rx="16" fill="#11142a" stroke="#fff" stroke-opacity=".16"/>
    <text x="20" y="34" fill="#e8eaf2" font-size="13" font-weight="700">TC-01 &#183; Login succeeds</text>
    <g font-size="11">
      <rect x="20" y="48" width="34" height="20" rx="6" fill="#22d3ee" fill-opacity=".16"/><text x="37" y="62" fill="#67e8f9" text-anchor="middle">UI</text>
      <rect x="60" y="48" width="66" height="20" rx="6" fill="#22c55e" fill-opacity=".16"/><text x="93" y="62" fill="#4ade80" text-anchor="middle">positive</text>
      <rect x="132" y="48" width="44" height="20" rx="6" fill="#f472b6" fill-opacity=".16"/><text x="154" y="62" fill="#f9a8d4" text-anchor="middle">high</text>
    </g>
    <text x="20" y="98" fill="#9ba3b9" font-size="11">STEPS</text>
    <g font-size="11" fill="#0a0c18" text-anchor="middle" font-weight="700">
      <circle cx="30" cy="120" r="10" fill="#a78bfa"/><text x="30" y="124">1</text>
      <circle cx="30" cy="152" r="10" fill="#a78bfa"/><text x="30" y="156">2</text>
      <circle cx="30" cy="184" r="10" fill="#a78bfa"/><text x="30" y="188">3</text>
    </g>
    <g fill="#fff" fill-opacity=".18">
      <rect x="50" y="116" width="150" height="8" rx="4"/>
      <rect x="50" y="148" width="130" height="8" rx="4"/>
      <rect x="50" y="180" width="160" height="8" rx="4"/>
    </g>
    <text x="20" y="226" fill="#9ba3b9" font-size="11">EXPECTED</text>
    <rect x="20" y="238" width="196" height="50" rx="10" fill="#22c55e" fill-opacity=".1"/>
    <circle cx="40" cy="263" r="9" fill="#22c55e"/><path d="M36 263l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="259" width="130" height="8" rx="4" fill="#4ade80" fill-opacity=".5"/>
  </g>
</svg>
